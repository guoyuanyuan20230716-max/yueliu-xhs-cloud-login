<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>阅流 · 云端登录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#182432;font:16px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:28px;margin:0}p{margin:8px 0}section{background:white;border:1px solid #d9e0e7;border-radius:12px;padding:18px;margin:16px 0}label{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}input,button{font:inherit;padding:10px 14px;border:1px solid #bac6d1;border-radius:8px}button{background:#fff;cursor:pointer}button.primary{background:#135b75;color:white;border-color:#135b75}button:disabled{opacity:.45;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.muted{color:#536477;font-size:14px}#status{font-weight:600;white-space:pre-wrap}#screen{display:block;width:100%;height:auto;border:1px solid #c8d0d9;cursor:crosshair;touch-action:manipulation}#screen[hidden]{display:none}#notice{color:#9b3e00}input[type=password]{max-width:100%;min-width:230px}.frame{overflow:auto}#placeholder{padding:50px 15px;text-align:center;background:#eef2f5}code{font-size:13px}button:focus-visible,input:focus-visible{outline:3px solid #58a4c1;outline-offset:2px}
</style>
<main>
 <h1>阅流 · 云端登录</h1>
 <p>操作 Render 上的小红书登录页面，完成扫码和短信验证。</p>
 <section id="connect">
  <label>服务访问密钥 <input id="token" type="password" autocomplete="off" spellcheck="false"></label>
  <button class="primary" id="start">连接登录会话</button>
  <p class="muted">密钥仅保留在当前页面内存中。验证码请在下方操作区输入，不需要发到聊天中。</p>
 </section>
 <section>
  <p id="status" role="status" aria-live="polite">尚未连接</p>
  <p id="notice" role="alert"></p>
  <p class="muted" id="expiry"></p>
  <div class="row">
   <button id="refresh" disabled>刷新云端画面</button>
   <button id="close" disabled>结束会话</button>
   <label><input id="auto" type="checkbox">每 8 秒刷新画面</label>
  </div>
  <p class="muted">点击画面中的输入框，再在下方输入短信验证码；点击画面中的确认按钮完成验证。画面是截图，需刷新才能看到变化。</p>
  <div class="frame"><div id="placeholder">连接后将在这里显示云端浏览器画面</div><img id="screen" hidden alt="可点击操作的小红书云端登录画面"></div>
  <div class="row">
   <label>输入到已选中的框 <input id="entry" type="password" autocomplete="off" maxlength="128" placeholder="短信验证码或登录所需文本"></label>
   <button id="send" disabled>输入到云端</button>
  </div>
  <div class="row" id="keys">
   <button data-key="Backspace" disabled>退格</button><button data-key="Tab" disabled>下一个输入框</button><button data-key="Enter" disabled>回车</button><button data-key="Escape" disabled>Esc</button>
   <button id="up" disabled>向上滚动</button><button id="down" disabled>向下滚动</button>
  </div>
  <button class="primary" id="save" disabled>已完成验证，检查并保存登录</button>
  <p class="muted">会话最多保留 10 分钟。保存成功后浏览器会关闭。免费实例重启仍可能丢失登录状态，本页尚不解决长期自动同步。</p>
 </section>
</main>
<script>
const $=id=>document.getElementById(id);
let session='',secret='',busy=false,phase='idle',imageURL='',lastFrame=0;
function controls(){const ready=phase==='ready'&&!busy;['refresh','send','save','up','down'].forEach(id=>$(id).disabled=!ready);document.querySelectorAll('[data-key]').forEach(b=>b.disabled=!ready);$('close').disabled=busy||!session||phase==='starting';$('start').disabled=busy||phase==='starting'||phase==='ready';}
async function request(path,body){
 const res=await fetch('/api/v1/login-console'+path,{method:body===undefined?'GET':'POST',headers:{'Authorization':'Bearer '+secret,'X-Login-Session':session,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:AbortSignal.timeout(25000)});
 if(!res.ok){let d;try{d=await res.json()}catch{}throw Error(d?.error||'请求失败 HTTP '+res.status)}
 return path==='/frame'?res.blob():res.json();
}
function showState(s){phase=s.status;const names={starting:'正在启动云端浏览器',ready:'登录会话已就绪',saved:'登录已确认并保存',closed:'会话已结束',expired:'会话已过期',error:'浏览器启动失败',idle:'尚未连接'};$('status').textContent=names[phase]||phase;$('notice').textContent=s.note||'';$('expiry').textContent=s.expires_at?'会话截止：'+new Date(s.expires_at).toLocaleString():'';if(phase!=='ready'){clearFrame()}controls();}
function clearFrame(){if(imageURL){URL.revokeObjectURL(imageURL);imageURL=''}$('screen').hidden=true;$('placeholder').hidden=false;}
async function frame(){const blob=await request('/frame');if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(blob);$('screen').src=imageURL;$('screen').hidden=false;$('placeholder').hidden=true;lastFrame=Date.now();}
async function run(fn){if(busy)return;busy=true;$('notice').textContent='';controls();try{await fn()}catch(e){$('notice').textContent=e.name==='TimeoutError'?'请求超时，请刷新查看状态；不要重复提交验证码。':e.message}finally{busy=false;controls()}}
$('start').onclick=()=>run(async()=>{secret=$('token').value.trim();if(!secret)throw Error('请先输入服务访问密钥');const s=await request('/start',{});session=s.session;showState(s);$('token').value='';if(phase==='ready')await frame()});
$('refresh').onclick=()=>run(async()=>{showState(await request('/state'));if(phase==='ready')await frame()});
$('close').onclick=()=>run(async()=>showState(await request('/close',{})));
$('save').onclick=()=>run(async()=>showState(await request('/save',{})));
async function action(body){await request('/action',body);await frame();}
$('screen').onclick=e=>run(async()=>{if(phase!=='ready')return;const r=e.target.getBoundingClientRect();const x=(e.clientX-r.left)*1100/r.width,y=(e.clientY-r.top)*820/r.height;await action({kind:'click',x,y})});
$('send').onclick=()=>run(async()=>{const text=$('entry').value;if(!text)throw Error('请输入验证码或文本');$('entry').value='';await action({kind:'text',text})});
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>run(()=>action({kind:'key',key:b.dataset.key})));
$('up').onclick=()=>run(()=>action({kind:'scroll',delta:-400}));$('down').onclick=()=>run(()=>action({kind:'scroll',delta:400}));
setInterval(()=>{if(!session||busy||document.hidden)return;if(phase==='starting')run(async()=>{showState(await request('/state'));if(phase==='ready')await frame()});else if(phase==='ready'&&$('auto').checked&&Date.now()-lastFrame>=8000)run(async()=>{showState(await request('/state'));if(phase==='ready')await frame()})},3000);
window.addEventListener('pagehide',()=>{secret='';$('entry').value='';clearFrame()});
</script>
</html>
